name: CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Least privilege: this workflow only reads the repo.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Node 24 matches local dev and the Vercel project. It bundles npm 11,
                # which writes package-lock.json; npm 10 (Node 18-22) disagrees about
                # optional peer deps (yaml under tailwindcss) and fails `npm ci`.
                node-version: [24.x]

        steps:
            # Actions pinned to commit SHAs (tags are mutable).
            - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            # npm ci only: installs exactly what the lockfile pins, and fails if
            # package.json and the lockfile disagree instead of resolving fresh.
            - name: Install dependencies
              run: |
                  node -v
                  npm -v
                  npm ci

            - name: Dump npm debug log (if any)
              if: failure()
              run: |
                  echo "NPM debug files:"
                  ls -la /home/runner/.npm/_logs || true
                  for f in /home/runner/.npm/_logs/*.log; do
                    echo "---- $f ----"
                    sed -n '1,200p' "$f" || true
                  done

            - name: Run linting
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build
